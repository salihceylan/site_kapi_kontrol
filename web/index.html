<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

  <!-- Flutter açılana kadar beyaz boş sayfa yerine koyu zeminde hafif marka yükleme görseli (satır içi SVG + CSS; kütüphane yok).
       İlk kare çizilince (flutter-first-frame) kaybolur. prefers-reduced-motion: animasyonsuz. -->
  <style>
    html { background: #06080B; }
    #brand-boot {
      position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 46%, #0F2050 0%, #070E20 52%, #03060B 100%), #06080B;
      pointer-events: none; transition: opacity .45s ease;
    }
    #brand-boot .bb-glow {
      position: absolute; width: min(120vw, 760px); height: min(120vw, 760px); border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 168, 38, .34) 0%, rgba(255, 168, 38, .12) 38%, rgba(255, 168, 38, 0) 70%);
      animation: bb-pulse 2.6s ease-in-out infinite alternate; will-change: opacity, transform;
    }
    #brand-boot svg { position: relative; width: min(52vw, 260px); height: auto; overflow: visible; filter: drop-shadow(0 0 14px rgba(255, 190, 70, .45)); }
    #brand-boot .bb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @keyframes bb-pulse { from { opacity: .55; transform: scale(.94); } to { opacity: 1; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) {
      #brand-boot { transition: none; }
      #brand-boot .bb-glow { animation: none; opacity: .85; }
    }

    /* Mobil Akıllı Kurulum ve Doğrudan APK İndirme Şeridi */
    #pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      width: min(92vw, 440px);
      background: rgba(14, 20, 32, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 190, 70, 0.35);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 180, 50, 0.2);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2147482990;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      pointer-events: auto;
    }
    #pwa-install-banner.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #pwa-install-banner img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    #pwa-install-banner .pwa-info {
      flex: 1;
      min-width: 0;
    }
    #pwa-install-banner .pwa-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pwa-install-banner .pwa-desc {
      font-size: 11.5px;
      color: #9CA3AF;
      margin: 2px 0 0 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #pwa-install-banner .pwa-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #pwa-install-btn {
      background: linear-gradient(135deg, #FFC83F 0%, #E08A1A 100%);
      color: #06080B;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(242, 178, 50, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
      text-decoration: none;
      display: inline-block;
    }
    #pwa-install-btn:active {
      transform: scale(0.96);
    }
    #pwa-dismiss-btn {
      background: transparent;
      border: none;
      color: #6B7280;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    #pwa-dismiss-btn:hover {
      color: #D1D5DB;
    }
    /* Kapatıldıktan sonra kullanıcıyı mağdur etmeyen yüzen indirme rozeti */
    #app-floating-pill {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: rgba(14, 20, 32, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 190, 70, 0.4);
      color: #FFC83F;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      z-index: 2147482980;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease;
      text-decoration: none;
    }
    #app-floating-pill:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

    <!-- brand-loader:end -->
    <span class="bb-sr">Yükleniyor</span>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('brand-boot');
      if (!boot) return;
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        boot.style.opacity = '0';
        setTimeout(function () { boot.remove(); }, 600);
      }
      window.addEventListener('flutter-first-frame', hide);
      // Güvenlik: olay hiç gelmezse (beklenmeyen yükleme sorunu) görsel sonsuza dek ekranı kaplamasın.
      setTimeout(hide, 45000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="web_push_helper.js"></script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Mobil Akıllı Kurulum Arayüzü -->
  <div id="pwa-install-banner" role="dialog" aria-live="polite" style="display: none;">
    <img src="icons/Icon-192.png" alt="Site Yönetim" />
    <div class="pwa-info">
      <div class="pwa-title" id="pwa-banner-title">Site Yönetim</div>
      <div class="pwa-desc" id="pwa-banner-desc">Android uygulamasını (APK) doğrudan indirin.</div>
    </div>
    <div class="pwa-actions">
      <button id="pwa-install-btn" type="button">APK İndir</button>
      <button id="pwa-dismiss-btn" type="button" aria-label="Kapat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- Kapatıldığında her an erişilebilen hafif indirme rozeti -->
  <div id="app-floating-pill" role="button" aria-label="Uygulamayı İndir">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span>APK İndir</span>
  </div>

  <script>
    (function () {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isStandalone) return;

      var banner = document.getElementById('pwa-install-banner');
      var pill = document.getElementById('app-floating-pill');
      var installBtn = document.getElementById('pwa-install-btn');
      var dismissBtn = document.getElementById('pwa-dismiss-btn');
      var titleEl = document.getElementById('pwa-banner-title');
      var descEl = document.getElementById('pwa-banner-desc');

      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.MSStream;
      var IOS_APP_STORE_URL = ""; // Resmi App Store linki yayına girince buraya eklenecektir

      function showBanner() {
        if (!banner) return;
        if (pill) pill.style.display = 'none';
        banner.style.display = 'flex';
        setTimeout(function () { banner.classList.add('show'); }, 60);
      }

      function hideBanner(toPill) {
        if (!banner) return;
        banner.classList.remove('show');
        setTimeout(function () {
          banner.style.display = 'none';
          if (toPill && pill && (isAndroid || isIos)) {
            pill.style.display = 'flex';
          }
        }, 350);
        sessionStorage.setItem('banner_dismissed_session', '1');
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', function () {
          hideBanner(true);
        });
      }

      if (pill) {
        pill.addEventListener('click', function () {
          showBanner();
        });
      }

      function triggerApkDownload() {
        if (descEl) {
          descEl.textContent = 'İndirme başladı! İndirilen APK dosyasını açıp Kur / Yükle diyerek yükleyebilirsiniz.';
        }
        if (installBtn) {
          installBtn.textContent = 'Tekrar İndir';
        }
        // Doğrudan APK dosyasını tarayıcıdan indir
        var link = document.createElement('a');
        link.href = '/site_yonetim.apk';
        link.download = 'site_yonetim.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      if (isAndroid) {
        if (titleEl) titleEl.textContent = 'Site Yönetim (Android)';
        if (descEl) descEl.textContent = 'Resmi Android uygulamasını (.APK) doğrudan telefonunuza indirin.';
        if (installBtn) {
          installBtn.textContent = 'APK İndir';
          installBtn.onclick = triggerApkDownload;
        }
        if (pill) {
          pill.querySelector('span').textContent = 'Android APK İndir';
        }
        setTimeout(function () {
          if (!sessionStorage.getItem('banner_dismissed_session')) {
            showBanner();
          } else if (pill) {
            pill.style.display = 'flex';
          }
        }, 1200);
      } else if (isIos) {
        if (titleEl) titleEl.textContent = 'Site Yönetim (iOS)';
        if (IOS_APP_STORE_URL && IOS_APP_STORE_URL.length > 5) {
          if (descEl) descEl.textContent = 'App Store üzerinden resmi iOS uygulamasını indirin.';
          if (installBtn) {
            installBtn.textContent = 'App Store';
            installBtn.onclick = function () { window.location.href = IOS_APP_STORE_URL; };
          }
        } else {
          if (descEl) {
            descEl.innerHTML = 'Safari alttaki <strong>Paylaş</strong> simgesine dokunup <strong>"Ana Ekrana Ekle"</strong>yi seçin.';
          }
          if (installBtn) {
            installBtn.style.display = 'none';
          }
        }
        if (pill) {
          pill.querySelector('span').textContent = 'iOS Kurulumu';
        }
        setTimeout(function () {
          if (!sessionStorage.getItem('banner_dismissed_session')) {
            showBanner();
          } else if (pill) {
            pill.style.display = 'flex';
          }
        }, 1500);
      } else {
        // Masaüstü / Diğer ortamlar: İsteğe bağlı APK indirme butonu
        if (titleEl) titleEl.textContent = 'Site Yönetim';
        if (descEl) descEl.textContent = 'Android cihazlar için resmi .APK dosyasını indirin.';
        if (installBtn) {
          installBtn.textContent = 'APK İndir';
          installBtn.onclick = triggerApkDownload;
        }
      }
    })();
  </script>
</body>
</html>
