; PlatformIO Project Configuration File
;
; AHBU production target. Other ESP32 families can be added again later.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_ldf_mode = deep+
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.3.1

[env:lolin_c3_mini]
board = lolin_c3_mini
board_build.partitions = partitions_ota_4mb.csv
build_flags = 
  ${env.build_flags}
  -D BOARD_ESP32_C3

[env:esp32_relay_wroom]
board = esp32dev
board_build.partitions = partitions_ota_4mb.csv
build_flags = 
  ${env.build_flags}
  -D BOARD_ESP32_WROOM_RELAY

