; PlatformIO Project Configuration File
;
; AHBU production target. Other ESP32 families can be added again later.
;
; SERI KOMUTLAR (sirket "Cihaz Dene" araci):
;  - Her derlemede acik: '?' 's' 'u' 'i' (salt-okunur durum), 'r' (role pulse), 'k' (kamera self-test), satir "ADMINPIN:NNNNNN".
;  - URETIM derlemesinde 'h' (role HIGH, 60 sn sonra otomatik birakilir), 'l' (role LOW) ve 'p' (pin bulma) yalniz ATOLYE
;    MODUNDA calisir: kayitli Wi-Fi bilgisi yoksa (yeni/sifirlanmis kart) veya BLE provisioning penceresi aciksa
;    (reset butonu 3 sn). Saha cihazi (Wi-Fi kayitli) bu uc komuta cevap vermez.
;  - Atolye kapisini tamamen kaldirmak (her komut her zaman acik + 5 sn durum dokumu) icin ilgili env'in build_flags satirina ekleyin:
;      -D AHBU_DEBUG_SERIAL_CMDS
; Ozel/test MQTT alan adi eki icin: -D AHBU_MQTT_HOST_SUFFIX=".ornek.com"   (varsayilan .gudeteknoloji.com.tr)

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_ldf_mode = deep+
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.3.1

[env:lolin_c3_mini]
board = lolin_c3_mini
board_build.partitions = partitions_ota_4mb.csv
upload_speed = 460800
build_flags = 
  ${env.build_flags}
  -D BOARD_ESP32_C3

[env:esp32_relay_wroom]
board = esp32dev
board_build.partitions = partitions_ota_4mb.csv
upload_speed = 460800
build_flags = 
  ${env.build_flags}
  -D BOARD_ESP32_WROOM_RELAY


