; PlatformIO Project Configuration File
;
; AHBU production target. Other ESP32 families can be added again later.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DARDUINOJSON_USE_DOUBLE=0
  -DARDUINOJSON_USE_LONG_LONG=0
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -fno-exceptions
lib_ldf_mode = chain+
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.3.1
  h2zero/NimBLE-Arduino@^1.4.2

[env:lolin_c3_mini]
board = lolin_c3_mini
board_build.partitions = partitions_ota_4mb.csv
