name: CI

# Pull request ve ana dal push'larinda: sunucu lint+test, Flutter analyze+test, gizli bilgi taramasi.
# NOT: Bu dosyada DEPLOY YOKTUR (canli dagitim kullanici karari; AGENTS.md kural 8 elle yurutulur).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no-undef = hata)
        run: npm run lint

      - name: Test (import smoke dahil)
        run: npm test

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Hata ve uyarilar CI'yi kirar; yalnizca "info" duzeyi bulgular kirmaz.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (tam gecmis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Yorum yazma izni (pull-requests: write) verilmedigi icin kapali
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Kuruluma ait (organization) depolarda GITLEAKS_LICENSE secret'i gerekir
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
