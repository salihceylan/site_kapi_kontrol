name: Uptime

# Sunucu DISINDAN saglik izleme (VPS cokerse sunucu ici izleme e-posta gonderemez).
# Her 30 dakikada bir canli saglik ucunu cagirir; basarisizsa is BASARISIZ sayilir ve GitHub e-posta gonderir.
#
# Kota: bir calisma ~10-15 sn surer ama dakikaya yuvarlanarak faturalanir -> 48 calisma/gun ~ 1440 dk/ay.
#   - Kamuya acik depoda Actions dakikalari ucretsiz ve sinirsizdir.
#   - Ozel depoda ucretsiz plan 2000 dk/ay'dir; CI (ci.yml) ayni kotayi kullanir. Kota daralirsa
#     cron'u saatlik yapin ("17 * * * *" -> ~720 dk/ay).
# Zamanlanmis is yalnizca varsayilan dalda (main) calisir; GitHub tam saat/yarim saat basindaki yogunlukta gecikebilir,
# bu yuzden dakika 7 ve 37 secildi. Depoda 60 gun hic etkinlik olmazsa (kamuya acik depolarda) GitHub zamanlamayi durdurur.
# Ilk kez Actions sekmesinden "Run workflow" ile elle calistirip yesil oldugunu dogrulayin.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    name: API saglik ucu
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Saglik ucunu kontrol et (3 deneme)
        env:
          HEALTH_URL: https://api.gudeteknoloji.com.tr/health
        run: |
          set -u
          ok=0
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -m 20 -A "kapi-uptime-check/1.0 (GitHub Actions)" -o body.json -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' body.json && grep -q '"database":"connected"' body.json; then
              ok=1
              break
            fi
            echo "Deneme $attempt basarisiz: HTTP $code"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Saglik ucu yanit vermiyor::api.gudeteknoloji.com.tr/health HTTP $code (veya veritabani bagli degil). Sunucu, nginx, Cloudflare veya API durmus olabilir."
            exit 1
          fi
          echo "Saglik ucu OK (HTTP $code, veritabani bagli)."
