[env:esp32c3_display]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200

build_flags =
    -D HARDWARE_TARGET="esp32c3-display"
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=-1
    -D TFT_DC=10
    -D TFT_RST=8
    -D TFT_BL=0
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=10000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@^7.0.0


