; Root-level PlatformIO entry point for VS Code.
; The actual firmware sources live in cihaz_kontrol/, but the PlatformIO
; extension looks for platformio.ini at the opened workspace root.

[platformio]
src_dir = cihaz_kontrol/src
include_dir = cihaz_kontrol/include
lib_dir = cihaz_kontrol/lib
test_dir = cihaz_kontrol/test
build_dir = cihaz_kontrol/.pio
default_envs = lolin_c3_mini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_ldf_mode = deep+
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.3.1
  adafruit/Adafruit HMC5883 Unified
  mikalhart/TinyGPSPlus

[env:lolin_c3_mini]
board = lolin_c3_mini
board_build.partitions = huge_app.csv

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
upload_speed = 921600

[env:esp32dev]
board = esp32dev

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1

[env:esp32-s2-saola-1]
board = esp32-s2-saola-1
